/*
 * DSH-Go Unrestricted Build — 签名配置
 * 用途：让没有正式签名证书的构建也能产出可安装的 APK
 *
 * 原理：
 *  1. debug buildType  → 使用 Android 内置的 androiddebugkey 签名
 *  2. release buildType → signingConfig = null，跳过签名验证
 *     + 禁用 ValidateSigningRelease Gradle 任务
 */
android {
    // ── Debug：直接用内置 debug keystore 签名 ──
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // ── 自定义 debug keystore（确保始终存在） ──
    signingConfigs {
        debug {
            storeFile     file("${projectDir}/.debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
        }
    }

    // ── Release：跳过签名，允许未签名 APK 安装 ──
    //    （配合 AndroidManifest 中 android:testOnly="false"）
    buildTypes {
        release {
            signingConfig null
            // 不需要 minify / shrink 即可跳过签名
        }
    }

    // ── 全局禁用签名校验任务 ──
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.findAll {
            it.name.contains("ValidateSigning") || it.name.contains("Signing")
        }.each { task ->
            task.enabled = false
        }
    }
}

// ── 确保 debug keystore 存在 ──
task ensureDebugKeystore {
    doLast {
        def ks = file("${projectDir}/.debug.keystore")
        if (!ks.exists()) {
            println "[no_signing] 生成默认 debug keystore..."
            // keytool 由 Android SDK build-tools 提供
            exec {
                commandLine "keytool",
                    "-genkeypair",
                    "-v",
                    "-storetype", "JKS",
                    "-keystore", ks.absolutePath,
                    "-storepass", "android",
                    "-keypass", "android",
                    "-alias", "androiddebugkey",
                    "-keyalg", "RSA",
                    "-keysize", "2048",
                    "-validity", "36500",
                    "-dname", "CN=DSH-Go, OU=Debug, O=Local, L=Unknown, S=Unknown, C=US"
            }
        }
    }
}
preBuild.dependsOn ensureDebugKeystore
